<?xml version="1.0" encoding="UTF-8"?>
<!--
  Project: Sammon mapping revisited (alpha-Sammon, scalable solver, temporal extension)
  Author: Martin Radvansky, VSB - Technical University of Ostrava
  Contact: martinradvansky@gmail.com
  Created: 2026-09-17
  License: for research use within the project; see projectstate.md

  Figure: study_design - process diagram of the STUDY DESIGN (how the
          conclusions were reached), in five steps. Distinct from:
          - method_overview.svg    = pipeline of the alpha-Sammon METHOD;
          - graphical_abstract.svg = the one-sentence takeaway.

  ============================ REDRAW 2026-09-19 ============================
  Reason (author feedback): "Study design - the texts are too large, it does
  not look good". After the 2026-09-19 font-size fix (every glyph raised to
  the Springer Nature artwork floor) the figure had become almost pure text:
  five bands of two to four dense sentences each, with the blocks nearly
  touching. At a fixed page width of 131.23mm (= the DAMI \textwidth of
  372pt) and a font floor of 8pt the only remedy is LESS TEXT and MORE
  WHITE SPACE, not smaller type.

  What changed (LAYOUT + WORDING; nothing was silently deleted - every item
  removed from the drawing is listed below and belongs in the CAPTION):
    * every block now carries its header plus AT MOST ONE short line;
    * gaps between consecutive steps doubled (3.5 -> 7.0 user units) and the
      block bodies hold a single line with generous padding, so the five
      steps are visible as five steps at a glance;
    * the smallest font tier (3.78 units = 7.4pt, used for the dense metric
      rows) is GONE: the figure now uses only 4.20 / 4.29 / 4.60 / 5.31
      units, i.e. nothing prints below 8.2pt (same tiers as
      method_overview.svg, author requirement 2026-09-19);
    * the decorative dashed lane divider was dropped (visual noise);
    * the "pause" icon in block 3 (two vertical bars) looked like a
      rendering artefact and was replaced by a padlock icon, which reads
      immediately as "sealed / not opened yet";
    * total height 123 -> 124 user units (242.8pt), i.e. unchanged, but the
      number of rendered text lines dropped from 20 to 12.
  Moved from the drawing to the figure CAPTION (verbatim list, so that
  nothing is lost - the caption text is in study_design_provenance.md):
    - the subtitle "From data to a pre-registered rule: fitted on training,
      confirmed on hold-out";
    - "(separate case studies, outside this split)" under the aside box;
    - the alpha grid step (0.25) and the names of the eight baselines
      (MDS, PCA, t-SNE, UMAP, PaCMAP, TriMap, densMAP, PHATE);
    - the metric names behind the three metric groups (local: AUC_RNX,
      trustworthiness, kNN Jaccard; global: scale-invariant stress, Shepard
      rho, Q global; geometry: class spread, centroid distance);
    - "Regime: split by rho_NN (low/mid/high)";
    - "Leave-one-dataset-out (LODO)" under the fitted rule;
    - "Pre-registered hypothesis families A1-A7" and "Holm-Bonferroni
      correction for multiple comparisons";
    - the second conclusion "The rule gives alpha_pred for free: no extra
      embedding run".

  Units:   viewBox 0 0 190 124; the physical page is 131.23mm x 85.65mm,
           i.e. 1 user unit = 131.23/190 = 0.690684 mm on the printed page
           (same convention as method_overview.svg). The figure is inserted
           at width=\textwidth (372pt), so the PDF is placed at scale 1 and
           printed pt = user units * 372/190 = user units * 1.95789
           (src/figures/check_font_sizes.py derives the same factor from the
           viewBox, because svglib emits the "Tf" operator in viewBox units).
           The height is 242.8pt = 0.44 * \textheight (552.69pt), i.e. below
           the 0.45 ceiling the author set for this figure.
  Fonts:   DejaVu Sans (covers the Greek letters used here), embedded.
             title (bold)            5.31 units = 10.40 pt
             block header (bold)     4.60 units =  9.01 pt
             body / labels           4.29 units =  8.40 pt
             subscripts              4.20 units =  8.22 pt
           NOTHING prints below 8 pt; subscripts are distinguished by their
           baseline shift (dy), not by a size drop.
  No underscores in rendered text (author feedback): rho_NN and alpha_pred
  are typeset as Greek letter + subscript, never as code identifiers.
  svglib limitations honoured here (see method_overview.svg):
    (a) text-anchor="middle" is applied to every <tspan> SEPARATELY, so any
        text containing a <tspan> is anchored "start" at an x computed
        exactly with reportlab pdfmetrics.stringWidth (the arithmetic is
        given in a comment next to each such line); single-run texts use
        "middle";
    (b) the character "&lt;" is dropped from the embedded subset font by
        reportlab in this document, so it is never used in rendered text.
  Colours: Okabe-Ito colour-blind safe palette.
           training lane       - blue           #0072B2 head / #E5EFF7 body
           hold-out lane       - orange         #E69F00 head / #FCF3E0 body
           step 2 (both lanes) - neutral grey   #595959 head / #EDEFF0 body
           confirmatory test   - bluish green   #009E73 head / #E0F4EE body
           conclusions         - reddish purple #CC79A7 head / #F9EDF4 body
           connectors, the split bracket and the aside box use neutral grey
           only, never for text. All text is #1A1A1A or white on colour.
  Layers:  each top-level <g> is an Inkscape layer (inkscape:groupmode="layer").
  Build:   make_study_design.bat / .sh (svglib + reportlab via
           clanek/img/src/svg2pdf.py; Inkscape is not on PATH on this machine).
  Note:    all boxes and icons are hand-placed schematic shapes; no
           experimental result is plotted here (this describes the design,
           not a result). The source of every number and name is in
           study_design_provenance.md.

  Vertical grid (user units); blocks are 5.6 (header) + 9.0 (body), gaps 7.0:
    title 6.0 | rule 8.6 | split label 13.9 | bracket 15.6
    step 1  19.6 ..  34.2      aside box 34.9 .. 40.5
    step 2  41.2 ..  55.8
    step 3  62.8 ..  77.4
    step 4  84.4 ..  99.0
    step 5 106.0 .. 120.6      page 124.0
  Header baselines are top + 4.48, body baselines are top + 6.06 (both
  centre the cap height of the respective font tier inside its band).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="131.23mm" height="85.65mm" viewBox="0 0 190 124"
     font-family="DejaVu Sans" font-size="4.29" fill="#1A1A1A">

  <!-- ======================= background ======================= -->
  <g id="layer_background" inkscape:label="00 background" inkscape:groupmode="layer">
    <rect id="page" x="0" y="0" width="190" height="124" fill="#FFFFFF"/>
  </g>

  <!-- ======================= title ======================= -->
  <g id="layer_title" inkscape:label="01 title" inkscape:groupmode="layer">
    <text id="title" x="95" y="6.0" text-anchor="middle" font-size="5.31" font-weight="bold" fill="#1A1A1A">Study design</text>
    <line id="title_rule" x1="5" y1="8.6" x2="185" y2="8.6" stroke="#CCCCCC" stroke-width="0.25"/>
  </g>

  <!-- ======================= data split bracket ======================= -->
  <!-- one pool of datasets splitting into the two lanes; the bracket spans
       exactly the two lane axes (x=45 and x=145) -->
  <g id="layer_split" inkscape:label="02 data split" inkscape:groupmode="layer">
    <text id="split_label" x="95" y="13.9" text-anchor="middle" fill="#1A1A1A">51 vector datasets, split before any rule fitting</text>
    <line id="split_bar" x1="45" y1="15.6" x2="145" y2="15.6" stroke="#999999" stroke-width="0.35"/>
    <line id="split_drop_left" x1="45" y1="15.6" x2="45" y2="18.2" stroke="#999999" stroke-width="0.4"/>
    <polygon id="split_head_left" points="43.7,18.2 46.3,18.2 45,19.6" fill="#999999"/>
    <line id="split_drop_right" x1="145" y1="15.6" x2="145" y2="18.2" stroke="#999999" stroke-width="0.4"/>
    <polygon id="split_head_right" points="143.7,18.2 146.3,18.2 145,19.6" fill="#999999"/>
  </g>

  <!-- ======================= flow arrows between the steps ======================= -->
  <g id="layer_arrows" inkscape:label="03 flow arrows" inkscape:groupmode="layer" stroke="#757575" fill="#757575">
    <!-- step 1 -> step 2 (two lanes; the arrows pass beside the aside box,
         whose x range 48..142 never reaches the arrowheads at 43.7..46.3
         and 143.7..146.3) -->
    <line x1="45" y1="34.2" x2="45" y2="39.8" stroke-width="0.45"/>
    <polygon points="43.7,39.8 46.3,39.8 45,41.2" stroke="none"/>
    <line x1="145" y1="34.2" x2="145" y2="39.8" stroke-width="0.45"/>
    <polygon points="143.7,39.8 146.3,39.8 145,41.2" stroke="none"/>
    <!-- step 2 -> step 3 (back into the two lanes) -->
    <line x1="45" y1="55.8" x2="45" y2="61.4" stroke-width="0.45"/>
    <polygon points="43.7,61.4 46.3,61.4 45,62.8" stroke="none"/>
    <line x1="145" y1="55.8" x2="145" y2="61.4" stroke-width="0.45"/>
    <polygon points="143.7,61.4 146.3,61.4 145,62.8" stroke="none"/>
    <!-- step 3 -> step 4 (the two lanes meet in the confirmatory test) -->
    <line x1="45" y1="77.4" x2="45" y2="83.0" stroke-width="0.45"/>
    <polygon points="43.7,83.0 46.3,83.0 45,84.4" stroke="none"/>
    <line x1="145" y1="77.4" x2="145" y2="83.0" stroke-width="0.45"/>
    <polygon points="143.7,83.0 146.3,83.0 145,84.4" stroke="none"/>
    <!-- step 4 -> step 5 (single, centred) -->
    <line x1="95" y1="99.0" x2="95" y2="104.6" stroke-width="0.45"/>
    <polygon points="93.7,104.6 96.3,104.6 95,106.0" stroke="none"/>
  </g>

  <!-- ======================= step 1: the two samples ======================= -->
  <g id="layer_step1_frames" inkscape:label="10 step1 frames" inkscape:groupmode="layer">
    <path id="train_head" d="M 6.5,19.6 H 83.5 A 1.5,1.5 0 0 1 85,21.1 V 25.2 H 5 V 21.1 A 1.5,1.5 0 0 1 6.5,19.6 Z" fill="#0072B2"/>
    <path id="train_body" d="M 5,25.2 H 85 V 32.7 A 1.5,1.5 0 0 1 83.5,34.2 H 6.5 A 1.5,1.5 0 0 1 5,32.7 Z" fill="#E5EFF7"/>
    <path id="holdout_head" d="M 106.5,19.6 H 183.5 A 1.5,1.5 0 0 1 185,21.1 V 25.2 H 105 V 21.1 A 1.5,1.5 0 0 1 106.5,19.6 Z" fill="#E69F00"/>
    <path id="holdout_body" d="M 105,25.2 H 185 V 32.7 A 1.5,1.5 0 0 1 183.5,34.2 H 106.5 A 1.5,1.5 0 0 1 105,32.7 Z" fill="#FCF3E0"/>
  </g>
  <g id="layer_step1_text" inkscape:label="11 step1 text" inkscape:groupmode="layer">
    <text id="train_head_text" x="45" y="24.08" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">1  Training &#8212; 32 datasets</text>
    <text id="train_body_text" x="45" y="31.26" text-anchor="middle" fill="#1A1A1A">Rule is fitted here</text>
    <text id="holdout_head_text" x="145" y="24.08" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">1  Hold-out &#8212; 19 datasets</text>
    <text id="holdout_body_text" x="145" y="31.26" text-anchor="middle" fill="#1A1A1A">Kept for the final test</text>
  </g>

  <!-- ======================= aside: data outside the split ======================= -->
  <g id="layer_aside" inkscape:label="12 aside data note" inkscape:groupmode="layer">
    <rect id="aside_box" x="48" y="34.9" width="94" height="5.6" rx="1.4" ry="1.4" fill="#F5F5F5" stroke="#999999" stroke-width="0.35" stroke-dasharray="1.6,1.2"/>
    <text id="aside_text" x="95" y="39.27" text-anchor="middle" fill="#1A1A1A">Also: 12 graphs + 7 temporal networks</text>
  </g>

  <!-- ======================= step 2: embed and evaluate ======================= -->
  <g id="layer_step2_frame" inkscape:label="20 step2 frame" inkscape:groupmode="layer">
    <path id="pipeline_head" d="M 6.5,41.2 H 183.5 A 1.5,1.5 0 0 1 185,42.7 V 46.8 H 5 V 42.7 A 1.5,1.5 0 0 1 6.5,41.2 Z" fill="#595959"/>
    <path id="pipeline_body" d="M 5,46.8 H 185 V 54.3 A 1.5,1.5 0 0 1 183.5,55.8 H 6.5 A 1.5,1.5 0 0 1 5,54.3 Z" fill="#EDEFF0"/>
  </g>
  <g id="layer_step2_text" inkscape:label="21 step2 text" inkscape:groupmode="layer">
    <text id="pipeline_head_text" x="95" y="45.68" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">2  Embed &amp; evaluate &#8212; each sample independently</text>
    <text id="pipeline_body_text" x="95" y="52.86" text-anchor="middle" fill="#1A1A1A">&#945; grid 0&#8211;3 (13 values), 8 baselines, local / global / geometry metrics</text>
  </g>

  <!-- ======================= step 3: fit the rule / held out ======================= -->
  <g id="layer_step3_frames" inkscape:label="30 step3 frames" inkscape:groupmode="layer">
    <path id="fit_head" d="M 6.5,62.8 H 83.5 A 1.5,1.5 0 0 1 85,64.3 V 68.4 H 5 V 64.3 A 1.5,1.5 0 0 1 6.5,62.8 Z" fill="#0072B2"/>
    <path id="fit_body" d="M 5,68.4 H 85 V 75.9 A 1.5,1.5 0 0 1 83.5,77.4 H 6.5 A 1.5,1.5 0 0 1 5,75.9 Z" fill="#E5EFF7"/>
    <path id="sealed_head" d="M 106.5,62.8 H 183.5 A 1.5,1.5 0 0 1 185,64.3 V 68.4 H 105 V 64.3 A 1.5,1.5 0 0 1 106.5,62.8 Z" fill="#E69F00"/>
    <!-- dashed body = "nothing has happened here yet" (the only dashed block) -->
    <rect id="sealed_body" x="105" y="68.4" width="80" height="9" rx="1.5" ry="1.5" fill="#FEFAF0" stroke="#E69F00" stroke-width="0.35" stroke-dasharray="1.6,1.2"/>
  </g>
  <g id="layer_step3_text" inkscape:label="31 step3 text" inkscape:groupmode="layer">
    <text id="fit_head_text" x="45" y="67.28" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">3  Fit the rule (training)</text>
    <!-- "alpha[pred] = g(rho[NN])" contains subscripts, hence anchored
         "start": the run widths measured with reportlab
         pdfmetrics.stringWidth on the registered "DejaVu Sans" at 4.29 /
         4.20 units sum to 33.87 units, centred on the lane axis x=45
         -> x = 45 - 33.87/2 = 28.06 -->
    <text id="fit_body_text" x="28.06" y="74.46" xml:space="preserve" fill="#1A1A1A">&#945;<tspan font-size="4.20" dy="1.3">pred</tspan><tspan dy="-1.3"> = g(&#961;</tspan><tspan font-size="4.20" dy="1.3">NN</tspan><tspan dy="-1.3">)</tspan></text>
    <text id="sealed_head_text" x="145" y="67.28" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">3  Held out</text>
    <!-- padlock icon + label, centred as one unit on the lane axis x=145:
         icon 5.0 + gap 3.0 + label 48.93 (stringWidth at 4.29) = 56.93,
         so the icon starts at 145 - 56.93/2 = 116.53 and the label at
         116.53 + 5.0 + 3.0 = 124.53 (anchored "start"). -->
    <g id="sealed_padlock" fill="#E69F00">
      <path id="padlock_shackle" d="M 117.78,71.8 V 70.55 A 1.25,1.25 0 0 1 120.28,70.55 V 71.8" fill="none" stroke="#E69F00" stroke-width="0.85"/>
      <rect id="padlock_body" x="116.53" y="71.8" width="5" height="4" rx="0.6" ry="0.6"/>
      <circle id="padlock_hole" cx="119.03" cy="73.3" r="0.55" fill="#FEFAF0"/>
      <rect id="padlock_slot" x="118.83" y="73.5" width="0.4" height="1.1" fill="#FEFAF0"/>
    </g>
    <text id="sealed_body_text" x="124.53" y="74.46" text-anchor="start" fill="#1A1A1A">Untouched until step 4</text>
  </g>

  <!-- ======================= step 4: confirmatory test ======================= -->
  <g id="layer_step4_frame" inkscape:label="40 step4 frame" inkscape:groupmode="layer">
    <path id="confirm_head" d="M 6.5,84.4 H 183.5 A 1.5,1.5 0 0 1 185,85.9 V 90.0 H 5 V 85.9 A 1.5,1.5 0 0 1 6.5,84.4 Z" fill="#009E73"/>
    <path id="confirm_body" d="M 5,90.0 H 185 V 97.5 A 1.5,1.5 0 0 1 183.5,99.0 H 6.5 A 1.5,1.5 0 0 1 5,97.5 Z" fill="#E0F4EE"/>
  </g>
  <g id="layer_step4_text" inkscape:label="41 step4 text" inkscape:groupmode="layer">
    <text id="confirm_head_text" x="95" y="88.88" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">4  Confirmatory test &#8212; hold-out only</text>
    <!-- "Apply alpha[pred] to the 19 hold-out datasets" contains a
         subscript, hence anchored "start": the run widths sum to 85.86
         units (stringWidth at 4.29 / 4.20), centred on x=95
         -> x = 95 - 85.86/2 = 52.07 -->
    <text id="confirm_body_text" x="52.07" y="96.06" xml:space="preserve" fill="#1A1A1A">Apply &#945;<tspan font-size="4.20" dy="1.3">pred</tspan><tspan dy="-1.3"> to the 19 hold-out datasets</tspan></text>
  </g>

  <!-- ======================= step 5: conclusions ======================= -->
  <g id="layer_step5_frame" inkscape:label="50 step5 frame" inkscape:groupmode="layer">
    <path id="conclusions_head" d="M 6.5,106.0 H 183.5 A 1.5,1.5 0 0 1 185,107.5 V 111.6 H 5 V 107.5 A 1.5,1.5 0 0 1 6.5,106.0 Z" fill="#CC79A7"/>
    <path id="conclusions_body" d="M 5,111.6 H 185 V 119.1 A 1.5,1.5 0 0 1 183.5,120.6 H 6.5 A 1.5,1.5 0 0 1 5,119.1 Z" fill="#F9EDF4"/>
  </g>
  <g id="layer_step5_text" inkscape:label="51 step5 text" inkscape:groupmode="layer">
    <text id="conclusions_head_text" x="95" y="110.48" text-anchor="middle" font-size="4.60" font-weight="bold" fill="#FFFFFF">5  Conclusions</text>
    <text id="conclusions_body_text" x="95" y="117.66" text-anchor="middle" fill="#1A1A1A">Choice of embedding method = choice of what to preserve</text>
  </g>

</svg>
