    - sammon_sparse_smacof
    # K5 (documentation/2026-09-12_plan_smeru_clanku.md): new neighborhood/
    # diffusion baseline methods (src/methods/densmap.py, src/methods/phate_.py)
    - densmap
    - phate
    # K7: predicted alpha (src/methods/sammon_alpha_pred.py) - requires
    # fit_alpha_rule.py to have already run (results/data/alpha_pred_rule.json),
    # otherwise it fails fail-loud (recorded as status=error, does not stop E1).
    - sammon_alpha_pred
  quick:
