    - {key: abalone, priority_rank: 2, is_control: false, requires_download: true}
    - {key: page_blocks, priority_rank: 3, is_control: false, requires_download: true}
    - {key: airfoil, priority_rank: 4, is_control: false, requires_download: true}
    - {key: banknote, priority_rank: 5, is_control: false, requires_download: true}
    - {key: mfeat_morphological, priority_rank: 6, is_control: false, requires_download: true}
    - {key: wall_robot, priority_rank: 7, is_control: true, requires_download: true}
    - {key: hill_valley, priority_rank: 8, is_control: false, requires_download: true}
    - {key: phoneme, priority_rank: 9, is_control: false, requires_download: true}
    - {key: dry_bean, priority_rank: 10, is_control: true, requires_download: true}
    - {key: ccpp, priority_rank: 11, is_control: false, requires_download: true}
    - {key: swiss_roll_hole, priority_rank: 12, is_control: false, requires_download: false}
    - {key: gaussian_clusters_separated, priority_rank: 13, is_control: false, requires_download: false}
    - {key: mobius_strip, priority_rank: 14, is_control: false, requires_download: false}
    - {key: klein_bottle_4d, priority_rank: 15, is_control: false, requires_download: false}
    - {key: twin_peaks, priority_rank: 16, is_control: false, requires_download: false}
    - {key: trefoil_knot, priority_rank: 17, is_control: false, requires_download: false}
    - {key: hyperbolic_paraboloid, priority_rank: 18, is_control: false, requires_download: false}
    - {key: anisotropic_ellipsoid, priority_rank: 19, is_control: false, requires_download: false}
  quick:
    n_max: 300
    candidates:
      - {key: banknote, priority_rank: 5, is_control: false, requires_download: true}
      - {key: swiss_roll_hole, priority_rank: 12, is_control: false, requires_download: false}
  smoke:
    n_max: 200
    candidates:
      - {key: banknote, priority_rank: 5, is_control: false, requires_download: true}
      - {key: swiss_roll_hole, priority_rank: 12, is_control: false, requires_download: false}
      - {key: trefoil_knot, priority_rank: 17, is_control: false, requires_download: false}
      # Addendum 2026-09-14 (N>=26) - verification of the new generators via the official pipeline
      - {key: hyperbolic_paraboloid, priority_rank: 18, is_control: false, requires_download: false}
      - {key: anisotropic_ellipsoid, priority_rank: 19, is_control: false, requires_download: false}

# K13 (documentation/2026-09-12_plan_smeru_clanku.md) - S4 supplement:
# rank-weighted stress (w_ij = ((r_ij+r_ji)/2)^-beta, r = neighbor rank) vs.
# the distance weights of alpha-Sammon (w_ij = D_ij^-alpha) - a negative
# pilot result from
# `reserse/skripty_20260912_myslitel/pilot_rank_weights.py` rewritten into a
# reproducible experiment (checkpoint/resume, config, no magic numbers).
# src/experiments/exp7_rank_weights.py.
exp7_rank_weights:
  datasets: [mnist_784, isolet, cnae9, olivetti, digits, coil20, iris, swiss_roll]
  n_components: 2
  n_max: 1000
  seeds: [0, 1, 2]
  max_iter: 300
  tol: 1.0e-4
  # distance weights (alpha-Sammon family) - same definition as
  # sammon_alpha*_smacof (src/sammon/weights.py::alpha_weights, eps_D from
  # sammon.eps_D.k/q)
  dist_alpha_grid: [0.0, 1.0, 2.0]
  # weights by neighbor rank (src/experiments/exp7_rank_weights.py::rank_weights)
  rank_beta_grid: [0.5, 1.0, 2.0]
  # baseline neighborhood methods for comparison (perplexity/n_neighbors
  # from their own config blocks in common/config.yaml methods.*, here just
  # the list of which one to call via src/methods/registry.py)
  baseline_methods: [tsne]
  quick:
    datasets: [iris, swiss_roll]
    n_max: 200
    seeds: [0]
    max_iter: 100
    dist_alpha_grid: [0.0, 1.0]
    rank_beta_grid: [1.0]
  smoke:
    n_max: 120
    seeds: [0]
    max_iter: 60
    dist_alpha_grid: [0.0, 1.0]
    rank_beta_grid: [1.0]

# K1 (documentation/2026-09-12_plan_smeru_clanku.md): properties of the
# input datasets of E1 (vector/synthetic) + E3 (graph inputs via 2 distance
# metrics) on the same subsample/standardization as the respective
# experiment. src/experiments/dataset_properties.py.
dataset_properties:
  # k for nn_ratio_k<k> (median distance to the k-th neighbor / median of all pairwise distances)
  nn_ratio_ks: [1, 5, 10]
  # k for the Levina & Bickel (2004) MLE estimate of intrinsic dimension
  id_mle_k: 10
  # k for hubness (Radovanovic et al. 2010) - skewness of the N_k occurrence distribution
  hubness_k: 10
  # fraction of points (ordered by mu=r2/r1) used in the TwoNN (Facco et
  # al. 2017) linear regression - the rest (distribution tails) is discarded
  twonn_fraction: 0.9

# K2 (documentation/2026-09-12_plan_smeru_clanku.md) - inter-cluster
# geometry over ALREADY SAVED exp1_dr_benchmark embeddings (no re-run of DR
# methods). src/experiments/exp1_cluster_geometry.py.
exp1_cluster_geometry:
  quick:
    max_datasets: 3
  smoke:
    max_datasets: 3

# K3 (documentation/2026-09-12_plan_smeru_clanku.md) - Pareto analysis over
# the already existing exp1_dr_benchmark_results.csv (no re-run).
# src/experiments/pareto_analysis.py.
pareto_analysis:
  # metric pairs for the Pareto fronts (name -> direction: max/min), see
  # src/experiments/pareto_analysis.py::pareto_front_mask
  fronts:
    auc_stress:
      auc_rnx: max
      stress_scale_invariant: min
    qlocal_qglobal:
      q_local: max
      q_global: max

# Method selection for the MAIN article text (tables/figures) - the
# supplement contains the full set of all methods from
# exp1_dr_benchmark.methods. Used in K3 (Pareto analysis), K12 (main.py
# tables/macros). No method is hardcoded in the code.
report:
  main_methods:
    - sammon_alpha0_smacof
    - sammon_alpha_auto
    - sammon_alpha_smacof
    - sammon_alpha2_smacof
    - mds
    - pca
    - tsne_auto
    - umap_auto
    - pacmap
    - trimap
    # K5 (documentation/2026-09-12_plan_smeru_clanku.md): new neighborhood/
    # diffusion baseline methods
    - densmap
    - phate
    # K7: predicted alpha (no tuning, 1 SMACOF run) - src/methods/sammon_alpha_pred.py
    - sammon_alpha_pred
  # K12b: metrics of the main E1 table (results/tables/exp1_main_table.*,
  # src/experiments/report_tables.py) -> direction ("max"=higher is better, "min"=lower is better)
  main_table_metrics:
    auc_rnx: "max"
    trustworthiness_k7: "max"
    stress_scale_invariant: "min"
    q_global: "max"
    shepard_spearman_rho: "max"
    class_spread_spearman: "max"
    centroid_dist_spearman: "max"
    wall_time_sec: "min"
  # subset of main_table_metrics that comes from exp1_cluster_geometry_results.csv
  # (K10; the E1 CSV has these columns only for methods added after the evaluate() extension)
  main_table_cluster_geometry_metrics:
    - class_spread_spearman
    - centroid_dist_spearman
  # K12c: numerical agreement tolerance for the classical_mds vs pca init in
  # E5 (max |difference| of the metric over paired runs; above the
  # tolerance a WARNING, below it INFO - the merge into a single 'pca'
  # level always happens, the difference is always written to the CSV)
  exp5_init_merge_tolerance: 1.0e-3
  # 2026-09-18 header width fix: max LaTeX-source characters per line of a
  # `write_booktabs_tex` header cell (src/experiments/report_tables.py::
  # _wrap_header_label) before it wraps onto another `\thead{...}` line -
  # a single token (e.g. a macro like 'AUC\textsubscript{RNX}', which
  # contains no space) is NEVER split further even if longer than this, so
  # curated short column labels stay on one line. Tuned by eye against the
  # widest tables (exp10_identifiability_table, exp14_convergence_robustness).
  table_header_max_line_chars: 14
  # methods against which "dominated_by_neighbor_method" is computed in the Pareto analysis (K3)
  neighbor_methods:
    - tsne
    - tsne_auto
    - umap
    - umap_auto
    - pacmap
    - trimap
    - densmap
    - phate
  # synthetic datasets (src/datasets/synthetic.py) - used in K4
  # (fig_regime_map.py) for synthetic/real coloring and the correlation
  # variant without synthetic datasets (reserse direction B robustness requirement)
  synthetic_datasets:
    - swiss_roll
    - s_curve
    - sphere
    - severed_sphere
    - helix
    - torus
    - two_moons
    - gaussian_clusters
    - hierarchical_clusters

stats:
  alpha: 0.05
  # primary metrics for the Friedman test (section 9, pseudocode part B):
  # metric name -> direction ("max"=higher is better, "min"=lower is better)
  primary_metrics:
    auc_rnx: "max"
    stress_scale_invariant: "min"
    trustworthiness_k7: "max"
  # critical values q_alpha for the Nemenyi post-hoc test (Demsar, J.
  # (2006), "Statistical Comparisons of Classifiers over Multiple Data
  # Sets", JMLR 7:1-30, Table 5 (studentized range statistic, alpha=0.05),
  # key = number of compared methods k.
  # K14 (2026-09-13, documentation/2026-09-13_k14_uklid_hardening.md): the
  # code no longer uses this table - `src/experiments/stats.py::nemenyi_q_alpha`
  # computes q_alpha directly from `scipy.stats.studentized_range` for ANY
  # number of methods k (the original table stops at k=20 and caused a
  # KeyError/WARNING for the E1 supplement with over 21 methods). The table
  # is KEPT HERE only as a reference/regression fixture for
  # `tests/test_stats.py::test_nemenyi_q_alpha_matches_legacy_table_for_k_le_20`
  # (formula agrees with the table to 1e-3).
  nemenyi_q_alpha_0_05:
    2: 1.960
    3: 2.343
    4: 2.569
    5: 2.728
    6: 2.850
    7: 2.949
    8: 3.031
    9: 3.102
    10: 3.164
    11: 3.219
    12: 3.268
    13: 3.313
    14: 3.354
    15: 3.391
    16: 3.426
    17: 3.458
    18: 3.489
    19: 3.517
    20: 3.544

# S2 tweak (documentation/2026-09-12_kontrola_vysledku_s1.md sections 3-4):
# lambda labels in fig_temporal_pareto.py only for a selected grid, so they
# do not overlap for small lambda (see the K9/K11 requirement "tweak
# figures from S1").
fig_temporal_pareto:
  label_lambdas: [0.1, 0.3, 1.0, 3.0, 10.0]

# S2 tweak: fig_regime_map.py - dataset labels overlapped at all 32 (see
# kontrola_vysledku_s1.md); 'label_datasets' is a curated subsample covering
# both regimes (low/high nn_ratio_k1) and a few borderline cases, the rest
# of the datasets stay in the figure without a name label (so no
# information is lost, only the visual clutter is reduced). Panel 2 (best
# alpha from {0,1,2}) has only 3 discrete y values -> points overlap, hence
# a small deterministic jitter in y (jitter_seed/jitter_std).
fig_regime_map:
  # Candidate datasets to label, in preference order (author feedback
  # 2026-09-17: dataset-name labels overlapped each other and the points -
  # "min popisku, citelny graf" is the explicit priority). This is NOT the
  # final labeled set: `_select_label_datasets` (fig_regime_map.py) walks
  # this list in order and keeps a candidate only if its log10(nn_ratio_k1)
  # is at least `min_log10_x_gap` away from every already-accepted label
  # (both panels share the x-axis) - the two global nn_ratio_k1 extremes are
  # always tried first, ahead of this list, so the plotted range's edges are
  # always represented if space allows.
  label_datasets:
    - iris
    - helix
    - swiss_roll
    - two_moons
    - segment
    - hierarchical_clusters
    - severed_sphere
    - digits
    - mnist_784
    - cnae9
    - letter
    - spambase
    - glass
  # Minimum spacing between two accepted dataset labels in log10(nn_ratio_k1)
  # units - chosen so at most ~8-9 labels fit across the full E1 vector-dataset
  # range (nn_ratio_k1 in [0.008, 0.5], i.e. ~1.8 decades) without crowding a
  # ~90mm-wide panel at 7pt font.
  min_log10_x_gap: 0.18
  jitter_seed: 42
  jitter_std: 0.06
  # Author fact-check 2026-09-18: 04_experimenty.tex claimed rho_NN
  # (nn_ratio_k1) correlates with the grid-optimum alpha more strongly than
  # every other dataset property. Recomputing over ALL numeric columns of
  # dataset_properties.csv (kind=='vector') shows the ambient dimension `d`
  # correlates more strongly (rho=-0.758 vs. -0.672 for nn_ratio_k1, n=51).
  # This list drives export_numbers.py's
  # `_add_regime_map_property_spearman` (results/tables/[<mode>/]
  # regime_map_property_spearman.csv) - the order here is only the table's
  # row order, not a claim about ranking. Columns excluded on purpose:
  # 'kind' (categorical, not a numeric property), 'n_classes' and
  # 'silhouette_input' (defined only for labeled datasets, i.e. mostly NaN
  # over the full E1 vector set and not part of the correlation the article
  # discusses).
  property_correlation_columns:
    - n
    - d
    - nn_ratio_k1
    - nn_ratio_k5
    - nn_ratio_k10
    - dist_cv
    - dist_skew
    - relative_contrast
    - id_twonn
    - id_mle
    - hubness_skew

# K10 (documentation/2026-09-12_plan_smeru_clanku.md) - "faithful map" hero
# figure: datasets x methods over ALREADY SAVED exp1_dr_benchmark embeddings
# (seed 'seed' below) - no re-run of DR methods. src/figures/fig_faithful_map.py.
# 2026-09-17 revision: added sammon_alpha_smacof (classical alpha=1 Sammon)
# as its own column, because sammon_alpha0_smacof and sammon_alpha_auto are
# numerically identical for 2 of the 3 datasets here (auto tuning picks
# alpha~0) - without the alpha=1 column the figure spent 2 of 4 columns on
# one indistinguishable pair. method_labels/dataset_labels are the
# human-readable strings shown in the figure (never the raw config keys).
fig_faithful_map:
  datasets: ["mnist_784", "iris", "hierarchical_clusters"]
  methods: ["sammon_alpha0_smacof", "sammon_alpha_smacof", "sammon_alpha_auto", "tsne_auto", "umap_auto"]
  # Column/row labels come from the SHARED `display_labels.method`/`dataset`
  # section above (src.figures.fig_common.display_label) - this figure used
  # to keep a private method_labels/dataset_labels copy here; merged
  # 2026-09-17 so all figure scripts share one mapping.
  seed: 0
  # 1-sigma scatter ellipse of the class in the output (multiple of the standard deviation)
  ellipse_n_std: 1.0
  # accompanying CSV (coordinates+classes+residuals) trimmed to this many
  # points per panel (the PDF always shows all points, rasterized) - same
  # convention as figures.gallery_methods.csv_max_points_per_panel
  csv_max_points_per_panel: 2000
  csv_subsample_seed: 42
  # Upper cap of the per-panel "stress fidelity" bar (fidelity = 1 -
  # min(stress, stress_bar_max)/stress_bar_max, see
  # fig_faithful_map._stress_to_fidelity): the smallest round number above
  # the max stress_scale_invariant observed over this figure's own
  # (dataset, method) scope (0.1954, mnist_784 x sammon_alpha_smacof) -
  # NOT a generic constant, re-check if datasets/methods change.
  stress_bar_max: 0.2

# K11 (documentation/2026-09-12_plan_smeru_clanku.md) - focused figure of
# graph layouts (replaces the original fig_graph_layouts.py, which is
# renamed to fig_graph_layouts_all.py for the supplement, see the K11
# requirement).
fig_graph_layouts_focus:
  # K11: 'cora' added only IF its E3 embeddings already exist (see the K11
  # requirement "after K8, cora optionally, if embeddings exist - otherwise
  # skip with a log") - the script checks this at run time; this list is a
  # CANDIDATE set, not a guaranteed result.
  graphs: ["polbooks", "football", "cora"]
  distance_metrics: ["shortest_path", "resistance"]
  # 2026-09-18 fix (reviewer VADA 2a): 'sammon_alpha0_smacof' (=MDS, alpha=0)
  # used to sit next to 'sammon_alpha_auto' (the tuned rule), but the tuned
  # rule picks alpha*=0 in 3 of the 4 (graph, distance) rows shown here
  # (results/data/exp3_graph_layout_results.csv, selected_hyperparam), so the
  # two columns were bit-identical embeddings in 3 of 4 rows (see git history
  # / fig_graph_layouts.py's module docstring for the verification). Replaced
  # 'sammon_alpha0_smacof' with 'spectral' - a native layout already computed
  # by exp3_graph_layout (no new experiment run), discussed in the article
  # (03_metoda.tex: for resistance distance the weight family covers the
  # spectral/commute-time layout at alpha=0; 05_vysledky.tex/06_diskuse.tex:
  # spectral has the best AUC_RNX among native layouts despite not being a
  # metric map) but previously absent from this main-text figure -
  # 'sammon_alpha_auto' (this paper's tuned rule) stays so the "does tuning
  # even move the layout" question this figure asks remains answerable.
  methods: ["sammon_alpha_auto", "tsne_auto", "umap_auto", "spectral", "spring"]

# Q1 step 1 (reserse/2026-09-14_specifikace_rozsireni_q1.md, backed up/
# refined in the author's requirement 2026-09-14) - post-hoc empirical
# verification of Proposition 2 (clanek/sections/03_metoda.tex, lines
# ~165-210: local residual and rho_NN) OVER ALREADY COMPUTED exp6_alpha_curves
# embeddings (no new DR computation). src/experiments/exp8_prop2_check.py.
exp8_prop2_check:
  # eps_D (k, q) MUST be exactly identical to exp6_alpha_curves.py::main()
  # (otherwise eps_D would not match the weights with which the embedding
  # was actually computed) - k is always taken from `sammon.eps_D.k`
  # (common/config.yaml), q from `exp6_alpha_curves.eps_D_q` if given,
  # otherwise also from `sammon.eps_D.q` - see
  # exp8_prop2_check.py::_resolve_eps_D_kq, which replicates exactly this
  # logic (no own copy of the numbers).
  #
  # Tolerance for verifying the assumption (P2) sigma_alpha(Y_alpha) <=
  # sigma_alpha(Ybar): SMACOF converges at tol=1.0e-4 (exp6_alpha_curves.tol),
  # not to the exact global minimum, so a small numerical overshoot must not
  # lead to a false rejection of P2. p2_tolerance_abs protects the case
  # sigma_bar~0 (alpha=0 -> Y=Ybar, exact equality expected up to rounding).
  p2_tolerance_rel: 1.0e-6
  p2_tolerance_abs: 1.0e-9
  # Numerical tolerance for "eps_D is practically zero"
  # (src/sammon/prop2_check.py::evaluate_proposition2). `estimate_eps_D`
  # (src/sammon/weights.py) already itself guarantees eps_D > 0 (otherwise
  # fail-loud), so eps_D below this value means practically missing
  # regularization (numerical noise), not a legitimately small but
  # effective eps_D. Fail-loud for D_min=0 (duplicate points) triggers ONLY
  # if eps_D <= eps_d_zero_tol - see the fix on 2026-09-14
  # (documentation/2026-09-14_exp8_prop2_check.md, "Overly strict check for
  # D_min=0"); before that, fail-loud always triggered on D_min=0 regardless
  # of eps_D, which excluded entire datasets with exact duplicates (iris,
  # glass, ...).
  eps_d_zero_tol: 1.0e-12
  # alphas for which the median tightness_b is computed in the summary table (K12a macros)
  summary_alphas: [1.0, 2.0, 3.0]
  # grid of thresholds tau for alpha_bound (fig_prop2_alpha_prediction): the
  # smallest alpha from exp6_alpha_curves.alpha_grid at which far_share(Ybar)
  # drops below tau - see
  # fig_prop2_alpha_prediction.py::compute_alpha_bound. tau=0.05 (5% of the
  # R_near(Ybar)-equivalent weighted budget belongs to far pairs) chosen as
  # the default middle of the grid {0.01, 0.05, 0.1}: 0.01 is too strict (on
  # the fine grid of alpha_grid with step 0.25, often unreachable before
  # alpha=3), 0.1 is too loose (does not distinguish datasets with different
  # rho_NN) - rationale in documentation/2026-09-14_exp8_prop2_check.md.
  alpha_bound_tau_grid: [0.01, 0.05, 0.1]
  alpha_bound_tau_default: 0.05
  bootstrap:
    # Spearman alpha_bound vs. alpha_star: number of bootstrap repetitions
    # (resampling datasets with replacement) for a 95% CI, deterministically seeded.
    n_boot: 5000
    seed: 20260914
    ci_level: 0.95
  quick: {}
  smoke: {}

# Q1 step 1: figure of tightness_b as a function of alpha, one curve per
# dataset colored by rho_NN (continuous, Viridis - Okabe-Ito has only 8
# discrete colors, not enough for 32 datasets). src/figures/fig_prop2_tightness.py.
fig_prop2_tightness:
  colormap: "viridis"
  # datasets labeled by name directly in the figure (the rest is just
  # color/position in the legend colorbar, so the labels do not overlap -
  # same convention as fig_regime_map.label_datasets)
  label_datasets: ["mnist_784", "isolet", "cnae9", "swiss_roll", "iris", "helix", "breast_cancer", "letter"]

# Q1 step 1: figure of alpha_bound (prediction from concentration,
# Proposition 2) vs. alpha_star (empirical optimum,
# exp6_alpha_optimum.csv). src/figures/fig_prop2_alpha_prediction.py.
fig_prop2_alpha_prediction:
  # which tau value (from exp8_prop2_check.alpha_bound_tau_grid) goes
  # directly into the main figure - the others remain only in the auxiliary CSV
  tau_for_figure: 0.05
  # datasets labeled by name directly in the figure - same convention as
  # fig_prop2_tightness.label_datasets / fig_regime_map.label_datasets
  # (the key was missing here, so the script failed fail-loud on KeyError)
  label_datasets: ["mnist_784", "isolet", "cnae9", "swiss_roll", "iris", "helix", "breast_cancer", "letter"]

# Q1 step 3 (reserse/2026-09-14_specifikace_rozsireni_q1.md, PART B) -
# metric fidelity task with known ground truth: `src/datasets/synthetic_truth.py`
# (generators for X + truth), `src/sammon/truth_metrics.py` (metrics),
# `src/experiments/exp9_metric_fidelity.py` (grid of scenario x replicate x
# method). This task's OWN block (STEP 3) - DOES NOT TOUCH exp8_prop2_check,
# report.main_methods, or any other block related to STEP 2 (holdout
# datasets, see reserse specification PART A).
exp9_metric_fidelity:
  n_components: 2
  # R = 20 replicates per scenario (B.2) - the unit of analysis in the statistics (B.5)
  replicates: 20
  # S4 "density pair" is exploratory/optional (B.2, B.6: "include only if
  # the budget allows") - the `make_density_pair` generator is implemented
  # and tested, but is NOT in the main grid (saves ~1.4 h wall time per B.6,
  # goal: overall ETA 1.5-2 h for S1-S3).
  active_scenarios: ["S1", "S2", "S3"]
  # report.main_methods (13, see config_experiments.yaml:report) + tsne/umap
  # with fixed parameters (B.4) - OWN list (not a reference to
  # report.main_methods, same convention as exp1_dr_benchmark.methods,
  # which is also not a reference).
  methods:
    - pca
    - mds
    - sammon_alpha0_smacof
    - sammon_alpha_smacof
    - sammon_alpha2_smacof
    - sammon_alpha_auto
    - sammon_alpha_pred
    - tsne
    - tsne_auto
    - umap
    - umap_auto
    - pacmap
    - trimap
    - densmap
    - phate
  pred_method: "sammon_alpha_pred"
  # F_B1 (primary, B.5): pred vs. each of these neighborhood methods
  primary_baselines: ["tsne_auto", "umap_auto", "densmap"]
  # F_B2 (secondary, B.5)
  secondary_baselines: ["pacmap", "trimap", "phate"]
  # F_B3 (exploratory, B.5) - all two-sided/TOST comparisons
  explorational_vs: ["sammon_alpha0_smacof", "sammon_alpha_auto", "tsne", "umap", "pca", "mds"]
  # primary metric and direction of improvement per scenario (B.5: S1 LRE_c
  # min, S2 CPCC_c max, S3 sigma_G min)
  primary_metric: {S1: "centroid_lre", S2: "cophenetic_pearson", S3: "geodesic_stress_si"}
  primary_direction: {S1: "min", S2: "max", S3: "min"}
  # number of deterministically chosen inter-leaf point pairs for
  # pointwise_ultrametric_spearman (S2, B.2 "over 200000 ... pairs")
  pointwise_ultrametric_n_pairs: 200000
  # generative parameters of each scenario (B.2, B.7 item 1) - EXCLUSIVELY
  # from here, no magic constants in src/datasets/synthetic_truth.py.
  # `seed_base`: generative seed = seed_base + replicate r (B.2); method
  # seed = r.
  scenarios:
    S1:
      # "planar clusters" - K clusters in a plane (e1,e2), geometric sequence of sigma
      K: 8
      n_k: 200
      sigma_min: 0.5
      sigma_max: 2.0
      center_range: 25.0          # centers ~ U([-center_range,center_range]^2)
      sep_factor: 4.0             # min. center distance >= sep_factor*(sigma_k+sigma_l)
      max_separation_attempts: 10000
      d: 10
      seed_base: 90100
      quick: {n_k: 50}
      smoke: {n_k: 25}
    S2:
      # "binary tree clusters" - balanced binary tree of depth `depth`
      depth: 4
      n_leaf: 100
      a1: 16.0                    # level-1 offset (a_l = a1*decay**(l-1))
      decay: 0.5
      sigma_leaf: 0.5
      d: 10
      seed_base: 90200
      quick: {n_leaf: 25}
      smoke: {n_leaf: 13}
    S3:
      # "bent sheet" - a developable quarter-cylinder surface, embedded in
      # R^d via a random orthogonal rotation (Theta_over_pi*pi = the
      # quarter-cylinder angle)
      n: 1500
      S: 3.0
      H: 1.0
      Theta_over_pi: 0.5
      beta_a: 2.0
      beta_b: 5.0
      noise: 0.02
      d: 10
      seed_base: 90300
      quick: {n: 375}
      smoke: {n: 200}
    S4:
      # "density pair" (exploratory, NOT in active_scenarios - see above)
      n1: 150
      n2: 1350
      sigma: 1.0
      center_distance: 20.0
      d: 10
      seed_base: 90400
      quick: {n1: 40, n2: 340}
      smoke: {n1: 20, n2: 180}
  quick:
    replicates: 2
    methods: ["sammon_alpha0_smacof", "sammon_alpha_pred", "tsne", "umap"]
  smoke:
    replicates: 1
    # methods is NOT given - ALL methods remain (same convention as
    # exp1_dr_benchmark.smoke: smoke should exercise every code path)

# Q1 step 3 (PART B.5) - statistical protocol of exp9_metric_fidelity_stats.py:
# families F_B1 (primary, m=9=3 scenarios x 3 primary_baselines), F_B2
# (secondary, m=9), F_B3 (exploratory, no Holm). Sign-flip permutation test:
# for replicates<=exact_perm_max_n, full enumeration of the 2**replicates
# sign vectors (B.5: "full enumeration 2^20=1048576"), otherwise Monte Carlo
# with n_perm_mc repetitions.
exp9_metric_fidelity_stats:
  seed: 20260914
  alpha_onesided: 0.05
  n_boot: 10000
  n_perm_mc: 20000
  exact_perm_max_n: 22

# Q1 step 3 (B.7 item 5) - gallery: 1 replicate (r=0) x 3 scenarios x
# selected methods (per the B.4 recommendation: oracle + proposed method +
# MDS baseline + 3 neighborhood methods that fail otherwise - Wattenberg
# 2016, Kobak&Berens 2019, Narayan 2021).
fig_metric_fidelity_gallery:
  replicate: 0
  methods: ["oracle_truth", "sammon_alpha_pred", "sammon_alpha0_smacof", "tsne_auto", "umap_auto", "densmap"]

# Q1 step 3 (B.7 item 6) - boxplots of the primary metric over R replicates,
# method x scenario, horizontal line for oracle_truth (S1/S3; S2 =
# mds_upper_bound_cpcc).
fig_metric_fidelity_boxes:
  methods: ["sammon_alpha0_smacof", "sammon_alpha_smacof", "sammon_alpha2_smacof", "sammon_alpha_auto", "sammon_alpha_pred", "tsne_auto", "umap_auto", "densmap", "pacmap", "trimap", "phate", "pca", "mds"]

# Correlation of embedding quality metrics (fig_metric_correlations.py,
# 2026-09-16). Reason: Bae, Jeon and Seo (IEEE VIS 2025, DOI
# 10.1109/VIS60296.2025.00014) show that metrics designed for different
# aspects of an embedding behave in a correlated way, and choosing a
# battery of metrics thereby favors certain families of methods. This
# script measures this on our data (a basis for choosing the columns of the
# main table, see
# documentation/2026-09-16_zadani_vyber_metrik_hlavni_tabulka.md).
fig_metric_correlations:
  # Candidate metrics. The first eight are the current main table (anchor:
  # report.main_table_metrics), the rest are further E1 metrics that may
  # measure the same "direction" - hence included in the correlation analysis.
  metrics:
    - auc_rnx
    - trustworthiness_k7
    - stress_scale_invariant
    - q_global
    - shepard_spearman_rho
    - class_spread_spearman
    - centroid_dist_spearman
    - wall_time_sec
    - continuity_k7
    - knn_jaccard_k7
    - q_local
    - distance_correlation
    - lcmc_k7
    - neighborhood_hit_k7
    - kruskal_stress1
  # Metrics for which "more is worse" - the sign is flipped for the
  # correlation analysis, so all columns have the same orientation (more =
  # better). Otherwise a pair measuring the same direction would come out
  # negatively correlated.
  lower_is_better:
    - stress_scale_invariant
    - wall_time_sec
    - kruskal_stress1
  # Threshold from which a pair of metrics is considered "practically
  # interchangeable" (|Spearman rho|); used only for printing and
  # clustering, not for filtering.
  redundancy_threshold: 0.9

# reserse/2026-09-17_zostreni_propozice2.md, section 10 - numerical
# verification of Lemma 2/Veta 1 (identity + bound on the identifiability
# gaps), Tvrzeni 3/4 (c_alpha, rho_NN), Veta 2 (dual certificate), and Veta 3
# (local quadratic law I0), evaluated over ALREADY COMPLETED exp6_alpha_curves
# embeddings (NO new DR run - reuses the loader/D/eps_D/theta/m/block logic of
# exp8_prop2_check.py, same as that experiment reuses exp6_alpha_curves).
# Called "E9"/"exp9_identifiability_check" in the reserse note; renamed here
# to E10/exp10_identifiability_check to avoid a name collision with the
# already-existing exp9_metric_fidelity. src/experiments/exp10_identifiability_check.py,
# src/sammon/identifiability.py.
exp10_identifiability_check:
  # datasets/alpha_grid/n_max/seeds are NOT listed here - they come DIRECTLY
  # from exp6_alpha_curves via resolve_experiment_config (YAML anchor
  # convention, not a copy - see exp8_prop2_check.py). Only the FIRST seed of
  # exp6_alpha_curves.seeds (per mode) is used as the canonical embedding
  # seed: a row here is (dataset, alpha), not (dataset, alpha, seed) - the
  # identity/bound/certificate/local-index are properties of ONE pair of
  # configurations (Y_0*, Y_alpha*) at a time, reserse section 10 "Radek =
  # (dataset, alpha)".
  embedding_seed_index: 0
  # Numerical tolerance for "eps_D is practically zero" (same role and value
  # as exp8_prop2_check.eps_d_zero_tol - kept as an OWN copy here, not a
  # cross-reference, matching the exp9_metric_fidelity convention of not
  # coupling unrelated experiment blocks).
  eps_d_zero_tol: 1.0e-12
  # eta of the Veta 2 certificate (Delta'_alpha >= eta is certified for
  # alpha >= alpha_eta) - 0.1 chosen as a round, interpretable 10% gain
  # threshold (reserse section 5.1/9.3).
  eta: 0.1
  # relative tolerance of the local quadratic law check
  # quadratic_law_holds := |Delta - alpha^2*I0_exact| <= quadratic_law_tol*Delta
  # (reserse section 10; 0.3 chosen as a generous first pass - Veta 3 is
  # OSNOVA/asymptotic, the article only reports the fraction where it holds,
  # see fracExpNineQuadraticLawHolds in reserse section 9.3).
  quadratic_law_tol: 0.3
  # Hessian-based local index I0 needs an eigendecomposition of an (n*p x n*p)
  # dense matrix (O((np)^3)) - skipped (NaN, hessian_skipped=True) for
  # n > n_max_hessian. 400 chosen so the full run still covers every
  # low-dimensional-manifold dataset (iris, wine, swiss_roll, helix, ... all
  # n<=400) while skipping the large high-dimensional ones (mnist_784,
  # isolet, n_max=2000) where I0 is least informative anyway (Veta 3 is a
  # LOCAL statement near Y_0*, most relevant for the small/manifold regime).
  n_max_hessian: 400
  # Relative eigenvalue threshold for cutting the p(p+1)/2 rigid-motion
  # directions from the Hessian/Gram pseudo-inverse (_pinv_quadratic_form) -
  # 1e-8 is well above float64 eigh noise floor (~1e-14 relative) and well
  # below the smallest genuine (non-rigid) eigenvalue observed on the
  # three-point family unit test (n_cut must equal p(p+1)/2 exactly, checked
  # by tests/test_exp10_identifiability.py).
  hessian_pinv_rel_tol: 1.0e-8
  # Bisection search for alpha_eta (Veta 2, general case R_near(witness)>0 -
  # see identifiability.alpha_eta_threshold).
  alpha_eta_bisection:
    alpha_max: 50.0
    xtol: 1.0e-6
    # R_near(witness)/[R_near+R_mid+R_far](witness) below this is treated as
    # 0 -> closed-form alpha_eta instead of bisection (reserse section 5.1).
    near_zero_rel_tol: 1.0e-6
  # Counterexample 1 (reserse sections 1.2b, 10) - Gaussian cluster + one
  # outlier point, values as suggested in the reserse note (e.g. n=200,
  # d=500, L=4). Used ONLY by tests/test_exp10_identifiability.py (a
  # synthetic counterexample fixture, not part of the production experiment
  # grid) - kept in config per the project rule "no magic numbers, even in
  # test fixtures".
  counterexample:
    n_cluster: 199   # n = n_cluster+1 = 200 total points
    d: 500
    L: 4.0
    seed: 20260917
    alpha: 1.0
    dilation_factor: 1.0   # M = dilation_factor * n (outlier pushed to distance ~n)
    c_alpha_max: 0.35      # upper bound asserted for c_alpha ("small" in the reserse sense)
  smoke:
    # A NARROWER smoke than exp6_alpha_curves' own smoke (which runs ALL 32
    # datasets): exp10 only needs to exercise every CODE PATH quickly, not
    # every dataset (reserse section 10, "Smoke rezim: 2 datasety x alpha
    # {0, 1}") - n_datasets/alpha_values SLICE the already-reused
    # exp6_alpha_curves.smoke lists, they do not redefine them.
    n_datasets: 2
    alpha_values: [0.0, 1.0]
    n_max_hessian: 150
  quick:
    n_max_hessian: 400

# reserse/2026-09-17_zostreni_propozice2.md, section 10, "Analyzy" (analysis
# items 2-6) - the analyses left DELIBERATELY out of
# exp10_identifiability_check.py itself (that experiment only computes the
# per-(dataset,alpha) row; unit=dataset statistics/permutation
# tests/bootstrap CIs live here in src/experiments/exp10_identifiability_stats.py).
# Output: results/data/[<mode>/]exp10_identifiability_stats.csv (analysis
# items 3-5) + results/tables/[<mode>/]exp10_identifiability_table.csv/.tex
# (item 2, per-dataset table for alpha_table).
exp10_identifiability_stats:
  seed: 20260917
  # H1 (Spearman, permutation p) - 10^4 permutations per correlation, as
  # specified in reserse section 7.2/10.
  n_perm: 10000
  # regression slope CI (item 3) and H2 phi CI (item 4) - cluster/percentile
  # bootstrap, resampling DATASETS with replacement.
  n_boot: 10000
  ci_level: 0.95
  # alpha values of the per-dataset table (analysis item 2) - intersected
  # with whatever alpha values are actually present in the exp10 CSV (so a
  # narrower quick/smoke alpha grid does not raise, only logs a WARNING for
  # the missing ones).
  alpha_table: [1.0, 2.0, 3.0]
  # quadratic-law tolerance (analysis item 5) is READ from
  # exp10_identifiability_check.quadratic_law_tol (same threshold as the
  # per-row quadratic_law_holds column) - not duplicated here.
  smoke:
    n_perm: 200
    n_boot: 200
  quick:
    n_perm: 2000
    n_boot: 2000

# 2026-09-17 fix (author: legend s >20 polozkami [alpha x holds/fails]
# zakryvala levou polovinu grafu) - src/figures/fig_identifiability_law.py:
# color=alpha now goes through a continuous colorbar instead of one legend
# entry per alpha value; the legend keeps at most 3 entries (law holds/
# fails, slope-1 reference line).
fig_identifiability_law:
  # Perceptually-uniform, colorblind-safe sequential colormap for the
  # continuous alpha colorbar (Okabe-Ito is a discrete 8-color palette, not
  # usable for a continuous scale here).
  colormap: "viridis"
  # Legend placement (matplotlib loc string) - chosen so it sits in a
  # low-density corner of the log-log scatter (see the task's PDF-crop
  # verification requirement), not on top of the diagonal point band.
  legend_loc: "lower right"

# documentation/2026-09-17_zadani_exp11_konvergence.md - diagnostic follow-up
# on the 13/384 exp10_identifiability_check rows (alpha>0) with
# both_gaps_nonneg==False (a negative Delta or Delta_prime), which per Veta 1
# must be non-negative at the global minimizer. Splits the violations into
# "tolerance of the solver" vs. "SMACOF converged to a different local
# minimum" by recomputing SMACOF with a tighter stopping criterion (variant
# 'tight') and, if that does not clear the negative gap, with a CROSS
# (warm-start) initialization from the OTHER alpha's cached optimum (variant
# 'warm') - see exp11_convergence_check.py module docstring for the exact
# per-variant definition.
#
# IMPORTANT: unlike other experiments, the (dataset, alpha) targets here and
# the reference E10 values used for baseline reproduction ALWAYS come from
# the FULL production exp6_alpha_curves/exp10_identifiability_check runs,
# regardless of exp11_convergence_check's OWN --quick/--smoke/--full mode -
# this experiment re-diagnoses a FIXED, already-identified set of violating
# rows from the completed full run, not a scaled-down recomputation of new
# data. exp11's own mode only controls how many (dataset, alpha) targets are
# processed and how tight/loose the 'tight'/'warm' solver budget is, so that
# --smoke exercises the full code path quickly (glass has n=214, so even a
# tight SMACOF re-fit is fast).
exp11_convergence_check:
  # (dataset, alphas) pairs with a non-negativity violation in exp10 (see
  # results/data/exp10_identifiability_check_results.csv, both_gaps_nonneg).
  # Fixed here on purpose (NOT re-derived from the E10 CSV at run time) - see
  # module docstring above: re-deriving it would make the experiment change
  # under our feet on every E10 recompute.
  targets:
    - dataset: glass
      alphas: [0.75, 1.0]
    - dataset: yeast
      alphas: [0.25, 0.75, 1.0, 1.25]
    - dataset: digits
      alphas: [0.25]
    - dataset: mnist_784
      alphas: [0.25, 0.5, 0.75]
    - dataset: optdigits
      alphas: [0.25]
    - dataset: cnae9
      alphas: [0.25]
    - dataset: usps
      alphas: [0.25]
  # SMACOF stopping criterion for the 'tight'/'warm' variants (max_iter=5000,
  # tol=1e-10, vs. exp6_alpha_curves.max_iter=300/tol=1e-4 used to produce
  # the cached 'baseline' embeddings) - a two-orders-of-magnitude tighter
  # tolerance and a 16x larger iteration budget, chosen to make "still
  # negative after this" a meaningful statement about a different local
  # minimum rather than about an under-converged run.
  tight:
    max_iter: 5000
    tol: 1.0e-10
  # Numerical tolerance for the 'baseline' variant reproducing
  # results/data/exp10_identifiability_check_results.csv exactly (same D,
  # eps_D, and cached Y_0*/Y_alpha* -> bit-for-bit reproducible up to
  # floating-point summation order) - a mismatch beyond this is a fail-loud
  # bug (we are not computing what E10 computed), not a numerical variant.
  # RELATIVE tolerance (also used as an absolute floor). Must NOT be absolute:
  # the stress fields are ~1e4, where one ulp is already ~2e-12, so an
  # absolute 1e-12 bound can never be met by a correct computation.
  baseline_match_tol: 1.0e-9
  smoke:
    # A single already-known violating row (glass, alpha=1.0) - enough to
    # exercise baseline/tight/warm end-to-end quickly; glass is small
    # (n=214), so even a loose smoke SMACOF budget below finishes in seconds.
    targets:
      - dataset: glass
        alphas: [1.0]
    tight:
      max_iter: 200
      tol: 1.0e-6

# E12 (documentation/2026-09-17_zadani_exp12_prodlouzeni_mrizky.md) -
# extension of the exp6_alpha_curves alpha grid beyond alpha=3: 11/51
# datasets had their auc_rnx optimum exactly on E6's right grid edge. Fit
# hyperparameters (seeds, n_max, max_iter, tol, eps_D_q, device,
# n_components) are NOT duplicated here - exp12_alpha_grid_extension.py
# always reads them from the FULL exp6_alpha_curves block above, regardless
# of exp12's own --quick/--smoke/--full mode (see the module docstring), so
# E6 and E12 rows of the same (dataset, alpha, seed) stay comparable.
exp12_alpha_grid_extension:
  # Datasets whose exp6 optimum sits at or near the alpha=3 cap, plus interior
  # controls. Explicit list on purpose: deriving it from exp6 at runtime would
  # silently change the experiment whenever exp6 is recomputed.
  datasets:
    - anisotropic_ellipsoid
    - banknote
    - helix
    - iris
    - klein_bottle_4d
    - mfeat_morphological
    - mobius_strip
    - s_curve
    - seeds
    - sphere
    - swiss_roll
    - torus
    - trefoil_knot
    - twin_peaks
    # interior-optimum controls
    - wall_robot
    - wine
    - swiss_roll_hole
    - ionosphere
  # Extension only - the 0..3 part already exists in exp6 and is NOT recomputed.
  alpha_grid: [3.25, 3.5, 3.75, 4.0, 4.25, 4.5, 4.75, 5.0, 5.25, 5.5, 5.75, 6.0]
  # Numerical ceiling: log10(rho(alpha)) stays below ~13 for every target
  # dataset up to alpha=6 (float64 has ~16 valid digits) - see the "numerical
  # ceiling" table in the zadani document. Rows above this threshold are
  # still written to the CSV (flagged via numerically_reliable=False), never
  # silently dropped.
  reliability_log10_max: 14.0
  smoke:
    datasets: [iris]
    alpha_grid: [3.25, 3.5]

# documentation/2026-09-17_zadani_exp13_preziti_sousedu.md - "how many of the
# k nearest neighbors survive the projection to 2D", the plain-language
# companion to auc_rnx/knn_jaccard_k7/q_global. Datasets/seed(s)/source
# experiment name are NOT duplicated here - taken directly from
# exp6_alpha_curves via resolve_experiment_config, same convention as
# exp10_identifiability_check (embedding_seed_index selects ONE canonical
# seed out of exp6_alpha_curves.seeds, a row here is (dataset, alpha, k),
# not averaged over seeds).
exp13_neighbor_survival:
  embedding_seed_index: 0
  k_values: [7]              # k=7 matches trustworthiness_k7/knn_jaccard_k7
  alpha_table: [0.0, 1.0, 2.0]   # fixed policies shown as table rows
  smoke:
    k_values: [7]
    alpha_table: [0.0, 1.0]

# documentation/2026-09-17_zadani_exp14_robustnost_konvergence.md - does the
# key claims of exp10_identifiability_check survive filtering out rows whose
# |Delta|/|Delta_prime| are below the SMACOF convergence residual measured by
# exp11_convergence_check (E11 found: the cached exp6_alpha_curves embeddings
# still had a median 0.6% residual stress decline under a much tighter
# stopping criterion, larger than |Delta| itself on 11/12 comparable rows)?
# Pure filtering/recompute over the ALREADY COMPLETED
# results/data/exp10_identifiability_check_results.csv and
# results/data/exp11_convergence_check_results.csv (always the FULL
# production files, regardless of exp14's own --quick/--smoke/--full mode -
# same convention as exp11_convergence_check.py reading the FULL exp6/exp10
# outputs - see that module's docstring) - NO new embedding/solver run.
exp14_convergence_robustness:
  thresholds: [0.0, 1.0e-4, 1.0e-3, 6.0e-3, 1.0e-2, 3.0e-2]
  # Numerical tolerance for the tau=0 row reproducing
  # results/data/exp10_identifiability_check_results.csv (frac_both_gaps_nonneg,
  # med_tight_v1, med_tight_sandwich, n_nontrivial_alpha_one) and
  # results/data/exp10_identifiability_stats.csv (H1_spearman rho,
  # cGammaTildeZero_vs_G_auc_oracle) exactly - RELATIVE tolerance (also used
  # as an absolute floor), same reasoning as exp11_convergence_check.baseline_match_tol:
  # these quantities are not all order-1 (e.g. tight_v1 medians ~5e-3), but an
  # absolute bound chosen for one field's magnitude can silently be wrong for
  # another - see documentation/2026-09-17_zadani_exp14_robustnost_konvergence.md,
  # section "PAST".
  baseline_match_tol: 1.0e-9
  # Same permutation-test convention/count as exp10_identifiability_stats.n_perm
  # (H1 Spearman), so the rho/p at tau=0 use the SAME method (rho is exactly
  # reproducible; the permutation p is not bit-identical to
  # exp10_identifiability_stats.csv's own p, because it uses exp14's OWN seed
  # below, not exp10_identifiability_stats.seed=20260917 - only rho is part of
  # the fail-loud tau=0 reproduction check, not p, see the module docstring).
  n_permutations: 10000
  seed: 0
  smoke:
    thresholds: [0.0, 1.0e-2]
    n_permutations: 100

# Flagship figure (author 2026-09-17): ONE picture showing the core problem
# "metric methods keep distances but shred neighborhoods" - 3 panels, same
# dataset, same original-space k-NN structure examined around ONE probe
# point on MDS(alpha=0) / alpha-Sammon (tuned) / t-SNE
# (src/figures/fig_neighborhood_problem.py). Message is a TRADE-OFF
# ("weighting is a knob between two goals"), never "our method wins" -
# t-SNE panel 3 has the BEST neighbor survival AND the WORST stress, on
# purpose (see that script's module docstring).
#
# dataset='helix' chosen over 's_curve' after rendering both with edges
# (see the task's visual-comparison requirement): helix's ring/spiral
# projections are more symmetric across all 3 panels and show a starker,
# cleaner MDS-tangle vs. tuned-order contrast; s_curve's numeric trade-off
# is slightly more monotonic (stress and neighbors both climb MDS -> tuned
# -> t-SNE) but the picture itself is visually less striking.
fig_neighborhood_problem:
  dataset: helix
  # k=7 matches exp13_neighbor_survival's headline number (same "neighbors
  # kept out of k" quantity, recomputed here directly from the cached
  # embeddings via src.sammon.metrics.knn_overlap_count - never read off
  # exp13's output CSV, so this figure has no dependency on exp13 having
  # been (re)run in the same mode).
  k_neighbors: 7
  # canonical embedding seed - same as exp13_neighbor_survival.embedding_seed_index
  # -> exp6_alpha_curves.seeds[0].
  seed: 0
  # panel 1: MDS = alpha-Sammon at alpha=0 (exp6_alpha_curves cache).
  mds_alpha: 0.0
  # panel 2: the "tuned" alpha for this dataset. helix's oracle alpha_best in
  # results/data/exp13_neighbor_survival_results.csv is alpha=3.5 (from
  # exp12_alpha_grid_extension), but 3.5 is NOT a point of the article's own
  # alpha_auto search grid {0, 0.25, ..., 3} (numAlphaGridPoints=13,
  # subsec:alpha_selection) - a reviewer correctly flagged that showing an
  # off-grid value in the flagship figure is inconsistent with the method as
  # described in the text. Use alpha=3.0, the LARGEST grid point, instead
  # (from exp6_alpha_curves, which already covers 0..3): verified directly
  # from the cached embeddings (helix, seed=0, k=7) that the illustrated
  # phenomenon survives essentially unchanged at the in-grid value:
  # neighbors_kept=5.49/7 at alpha=3.0 vs. 5.53/7 at alpha=3.5 (both up from
  # 2.17/7 at alpha=0), stress=0.0228 vs. 0.0284. Author reviewer fix, 2026-09-18.
  tuned_alpha: 3.0
  tuned_alpha_experiment: exp6_alpha_curves
  # panel 3: t-SNE, default hyperparameters (exp1_dr_benchmark cache).
  tsne_method: tsne
  # Author feedback 2026-09-17 (FOURTH review, MEASURED, not guessed): on the
  # full helix/alpha=0 cache, a probe's true k=7 original-space neighbors do
  # NOT end up far away (median rank of a true neighbor in the embedding's
  # own order is only 13, and its distance is a median 3.8x / 90th-pct 10.5x
  # the embedding's own local point spacing) - they get "true neighbors
  # crowded out by intruding points" close to the probe, not "true
  # neighbors pushed to the far side of the map". Drawing edges at the
  # scale of the whole panel can therefore never show the failure (the
  # edges are always short relative to the panel). Fix: for ONE probe point
  # (n_probes=1 - 4 probes crowded out the zoom itself), zoom into a window
  # around it (radius = zoom_radius_local_spacing_multiple * the embedding's
  # OWN median nearest-neighbor spacing, so the window means the same
  # relative thing in every panel despite wildly different absolute
  # coordinate scales between MDS/alpha-Sammon/t-SNE) and mark, inside that
  # window, which nearby points are the probe's TRUE original-space
  # neighbors vs. INTRUDERS (points among the probe's k embedding neighbors
  # that are not true neighbors) - see fig_neighborhood_problem.py's
  # `_zoom_roles`/`_local_spacing`/module docstring.
  n_probes: 1
  probe_marker_size: 30.0     # scatter `s=` for the probe marker IN THE MAIN PANEL (point_size=4.0 for regular points)
  probe_marker_edgewidth: 1.0 # black outline width on the main-panel probe marker
  point_size: 4.0
  point_cmap: viridis
  # zoom inset (see the FOURTH-review note above): radius as a MULTIPLE of
  # the panel's own median nearest-neighbor spacing - 10.0 comfortably
  # covers the measured 90th-percentile true-neighbor distance (10.5x) so
  # nearly all k=7 true neighbors fall inside the window in every panel.
  zoom_radius_local_spacing_multiple: 10.0
  # Author feedback 2026-09-17 (FIFTH review, on the smoke render): the
  # 46%/"upper left" inset OVERLAPPED real ring points (helix projects to a
  # ring/annulus in every panel, so a corner inset sits ON TOP of the ring
  # unless it is tiny), and role markers were so big that 14 points (worst
  # case: MDS panel, full data, 7 true neighbors + 7 intruders) turned into
  # an unreadable blob. Fix, MEASURED on full cached embeddings (never
  # guessed - see the scratchpad verification the task required): a helix
  # ring has a COMPLETELY EMPTY hole around its own centroid out to at
  # least 20-25% of the panel's half-width in all 3 panels (checked
  # per-panel, since MDS/tuned/t-SNE project the ring at very different
  # scales) - `zoom_inset_loc: "center"` + `zoom_inset_size_pct` well under
  # that (so the inset box, whose half-width is `zoom_inset_size_pct/2` of
  # the panel width, never reaches the ring) puts the whole inset in
  # naturally blank space, and the mark_inset connector lines (center -> a
  # point ON the ring) stay inside that same empty disk for their entire
  # length, never crossing another point.
  zoom_inset_size_pct: 36.0        # inset_axes width=height="<...>%" of the parent panel - inset half-width = 18% of panel half-width, inside the >=20-25% empty-hole margin measured on full data (all 3 panels, with margin) - see the note above
  zoom_inset_loc: "center"         # the ring's own empty hole (see note above) - NOT a corner, which sits on top of ring data
  zoom_mark_inset_loc1: 2          # mark_inset connector corners (1=upper right,2=upper left,3=lower left,4=lower right) - lines run through the empty hole regardless of corner choice (verified), 2/4 = a single clean diagonal
  zoom_mark_inset_loc2: 4
  # Marker sizes re-measured against the WORST CASE (MDS panel, full data:
  # 7 true neighbors + 7 intruders + 1 probe = 15 markers in one small
  # inset - see the FIFTH-review note above), NOT the smoke sample (which
  # only ever showed 1-2 intruders and looked fine at any size). SIXTH
  # REVIEW (author 2026-09-17): 13/24pt markers at 28% inset size still
  # blobbed together; two of the 15 markers happen to be genuinely
  # near-coincident in the MDS embedding (0.20x local_spacing apart - a
  # real feature of the data: two of the probe's true neighbors collapsed
  # almost onto each other - no marker size can fully separate that one
  # pair without becoming invisible, but it stays visually distinguishable
  # as "2 diamonds" via the visible corner of each). At 8/16pt + a slightly
  # larger 36% inset, ALL OTHER 13 of the 15 worst-case markers are cleanly
  # separated and individually countable (verified in the scratchpad render
  # required by the task - see the task's response for the exact count).
  zoom_point_size: 3.0             # regular (non-role) point marker size INSIDE the inset
  zoom_true_neighbor_size: 8.0     # role (b): probe's true original-space k-NN, marker size inside the inset
  zoom_intruder_size: 8.0          # role (c): probe's embedding k-NN that are NOT true neighbors ("vetrelci"), marker size inside the inset
  zoom_probe_size: 16.0            # role (a): the probe point itself inside the inset - biggest marker, black outline
  zoom_marker_edgewidth: 0.4
  # smoke: exp6_alpha_curves/exp1_dr_benchmark's own --smoke configs DO
  # cover 'helix' (unlike --quick, which omits it entirely - see
  # config_experiments.yaml exp1_dr_benchmark.quick/exp6_alpha_curves.quick
  # datasets lists), but with a narrower alpha grid (0/1/2/3, no
  # exp12_alpha_grid_extension) and tsne_auto instead of tsne (E1 smoke's
  # reduced_methods) - so --quick is not usable for this figure out of the
  # box (see the module docstring), only --smoke/--full.
  smoke:
    tuned_alpha: 3.0
    tuned_alpha_experiment: exp6_alpha_curves
    tsne_method: tsne_auto

# Demsar (2006, JMLR 7:1-30, Fig. 1) critical-difference diagram
# (src/figures/fig_cd_diagram.py) - author feedback 2026-09-17: the previous
# version drew one bar per pairwise insignificant comparison (30+ stacked
# bars) instead of one bar per MAXIMAL clique of methods that are mutually
# not significantly different, and labels overlapped the bars. All layout
# constants below are in INCHES (figure width is fig_common.WIDTH_FULL_WIDTH_IN;
# height is derived from these constants and the number of label rows/clique
# bars, so no magic number sits in the plotting code itself).
fig_cd_diagram:
  top_margin_in: 0.95        # room above the axis for the (2-line) title + the CD reference bar
  title_depth_in: 0.14       # distance of the (2-line) title text below the TOP of the figure
  cd_reference_depth_in: 0.64  # distance of the CD reference bar below the top of the figure
  # author feedback 2026-09-17 (second review): critical-difference bars must
  # sit right under the axis (Demsar 2006 Fig. 1 layout), NOT below the
  # label fan-out - otherwise the reader cannot see which axis points a bar
  # connects. Depth order is axis -> axis_tick_gap_in -> clique bars ->
  # clique_gap_in -> method labels (see fig_cd_diagram._draw_cd_diagram).
  axis_tick_gap_in: 0.14     # axis line -> first critical-difference bar (or first label row if there are no bars)
  clique_row_height_in: 0.20 # one row per critical-difference bar (maximal clique)
  clique_gap_in: 0.14        # last critical-difference bar -> first row of method labels
  label_row_height_in: 0.20  # one row per "fanned-out" method label (left and right side)
  bottom_margin_in: 0.12
  left_margin_in: 1.55       # reserved for left-side (better-ranked half) method labels
  right_margin_in: 1.55      # reserved for right-side (worse-ranked half) method labels
  label_gap_in: 0.05         # axis edge -> label text anchor
  marker_size_pt: 16
  axis_linewidth: 1.0
  tick_linewidth: 0.8
  tick_length_in: 0.055
  connector_linewidth: 0.6
  clique_bar_linewidth: 3.2
  cd_reference_linewidth: 1.8
  label_fontsize_pt: 6.5
  tick_fontsize_pt: 6.0
  title_fontsize_pt: 7.0
  # Okabe-Ito indices (fig_common.OKABE_ITO) used for the plot elements.
  axis_color_index: 0     # black - axis line, ticks, points, connectors
  clique_bar_color_index: 5   # blue "#0072B2" - critical-difference bars
  cd_reference_color_index: 6 # vermillion "#D55E00" - the CD reference bar (visually distinct from clique bars)

# E15 "downstream discovery task" (author request 2026-09-18, motivated by
# a DAMI editor comment: "there is not a single task in the whole
# manuscript where a better map leads to a better FINDING"). Two questions
# per labeled dataset - Q1 `nearest_class_pair`, Q2 `most_dispersed_class`
# (definitions and class-count thresholds in src/sammon/discovery_task.py,
# reusing the K2 cluster-geometry aggregates) - answered from the ALREADY
# SAVED exp1_dr_benchmark embeddings (NO new DR run), for methods in
# report.main_methods (single source of truth, not duplicated here).
# src/experiments/exp15_discovery_task.py.
exp15_discovery_task:
  # Relative tolerance for flagging an (informational-only) exact tie
  # between the best and runner-up candidate answer in either D_in or
  # D_out - recorded in tie_in_truth/tie_in_prediction but never changes
  # which answer is scored as correct (deterministic stable-sort tiebreak,
  # see discovery_task._pick_extremum).
  tie_relative_tolerance: 1.0e-9
  quick:
    max_datasets: 4
  smoke:
    max_datasets: 3

# Paired statistics over exp15_discovery_task_results.csv
# (src/experiments/exp15_discovery_task_stats.py). Unit of analysis =
# DATASET (per docs/CLAUDE.md rule against pseudoreplication) - seeds are
# aggregated to one value per (dataset, method, question) via the MEDIAN
# BEFORE any comparison across datasets. `reference_method` is compared
# against every OTHER method in report.main_methods (no separate baseline
# list here - single source of truth), Holm-corrected within each
# question's family (m = number of baselines for that question).
exp15_discovery_task_stats:
  reference_method: sammon_alpha_pred
  # Below this many datasets with a defined paired value for BOTH methods,
  # a pairwise test (McNemar for the hard score, Wilcoxon signed-rank for
  # the soft rho) is skipped for that (method, question) pair rather than
  # reporting a degenerate/undefined p-value.
  min_paired_datasets: 3
  alpha: 0.05
  # statsmodels.stats.contingency_tables.mcnemar: exact (binomial) test up
  # to this many discordant pairs, chi2 with continuity correction above it
  # (matches statsmodels' own recommended cutover, see its docstring).
  mcnemar_exact_max_n: 25
  quick:
    min_paired_datasets: 2
  smoke:
    min_paired_datasets: 2
