# K10 (documentation/2026-09-12_plan_smeru_clanku.md) - "faithful map" hero
# figure: datasets x methods over ALREADY SAVED exp1_dr_benchmark embeddings
# (seed 'seed' below) - no re-run of DR methods. src/figures/fig_faithful_map.py.
fig_faithful_map:
  datasets: ["mnist_784", "iris", "hierarchical_clusters"]
  methods: ["sammon_alpha0_smacof", "sammon_alpha_auto", "tsne_auto", "umap_auto"]
