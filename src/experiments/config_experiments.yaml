  gain_frac_tau: 0.005
  holm_alpha: 0.05
  quick:
    n_boot: 1000
    n_perm_mc: 2000
  smoke:
    n_boot: 200
    n_perm_mc: 500
    eligibility:
      min_d: 2
      min_n: 20

# Q1 step 2 (A.9 item 5) - screening of regime L candidates (step 0, BEFORE
# running E1/E6 on the hold-out set). src/experiments/screen_regime_candidates.py.
# Addendum 2026-09-14 (change of pre-registration, see reserse/...,
# "Addendum 2026-09-14"): `is_control` for phoneme->false (empirically
# low_ratio, see regime_candidates_screen.csv), for wall_robot/dry_bean->true
