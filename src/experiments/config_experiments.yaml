# Parameters of experiments E1-E5 (src/experiments/exp1..5*.py) and the
# shared statistics (src/experiments/stats.py). Separated from
# src/common/config.yaml (the `sammon:`/`methods:`/`datasets:` sections there
# are maintained by a different agent working concurrently - this file does
# NOT touch them; it is loaded by its own loader
# src/experiments/config_experiments.py). No magic numbers in the experiment
# code - everything belongs here. Every block may have a `quick:` sub-key,
# which for --quick mode overrides same-named keys (see
# resolve_experiment_config).

# Q1 step 2 (reserse/2026-09-14_specifikace_rozsireni_q1.md, A.5 and A.9
# item 4) - hold-out candidate datasets for regime L. The shared YAML anchor
# &q1_holdout must be defined BEFORE its first use (YAML aliases only refer
# backwards) - hence it is here, before exp1_dr_benchmark. Order =
# pre-registered priority (A.3.1 real datasets 1-9, A.3.2 real reserves
# 10-11 - R1 frey_faces OMITTED, HTTP 403 verified 2026-09-14, see the
# src/datasets/uci_extra.py docstring - A.3.3 synthetic 12-17). This list is
# NEVER added to exp1_dr_benchmark.datasets/exp6_alpha_curves.datasets (rule
# fit, A.5) - only to the *_holdout keys below and
# sammon_alpha_pred.holdout_datasets.
# Addendum 2026-09-14 (reserse/2026-09-14_specifikace_rozsireni_q1.md,
# "Addendum 2026-09-14: N>=26"): 2 additional synthetic candidates added
# (priority 18-19, different curvature/topology than the existing 6, see
# src/datasets/synthetic.py), so that N in regime L grows from the expected
# 24 to >=26 (the Noether robustness requirement A.7). ADDED BEFORE any DR
# result on the hold-out datasets (see the addendum below) - the selection
# is based exclusively on the expected rho_NN, not on the quality of the
# embedding.
q1_holdout_datasets: &q1_holdout
  - shuttle
  - abalone
  - page_blocks
  - airfoil
  - banknote
  - mfeat_morphological
  - wall_robot
  - hill_valley
  - phoneme
  - dry_bean
  - ccpp
  - swiss_roll_hole
  - gaussian_clusters_separated
  - mobius_strip
  - klein_bottle_4d
  - twin_peaks
  - trefoil_knot
  - hyperbolic_paraboloid
  - anisotropic_ellipsoid

# Addendum 2026-09-14 (reserse/2026-09-14_specifikace_rozsireni_q1.md,
# "Addendum 2026-09-14: change of pre-registration"): anchor for the
# negative control datasets of regime L - ORIGINALLY only `phoneme`
# (A.3.1 #9) was pre-registered, but it empirically fell into regime L
# (rho_NN=0.070 < 0.1092), and thus stopped being a control. Replaced by TWO
# datasets that empirically came out OUTSIDE regime L (mid_ratio):
# `wall_robot` (rho_NN~0.117-0.133) and `dry_bean` (rho_NN in the same band)
# - see screen_regime_candidates.csv and the addendum at the end of
# reserse/2026-09-14_specifikace_rozsireni_q1.md. `designated_negative_controls`
# (below) is an independent anchor for the sanity check in
# exp1_holdout_confirmatory.py (F_A3) - `is_control` in `candidates` is only
# a descriptive column of the output CSV; the F_A3 statistic already used
# the EMPIRICALLY determined regime_frozen != 'low_ratio', not this list
# (no change in F_A3 behavior, only visibility of the pre-registration).
q1_negative_control_datasets: &q1_negative_controls
  - wall_robot
  - dry_bean

