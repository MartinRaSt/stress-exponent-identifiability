    seeds: [0, 1]
    datasets: [iris, swiss_roll, digits]
    methods: [pca, mds, sammon_classic, sammon_alpha_smacof, tsne, tsne_auto, umap_auto]
  # smoke: E1 has 32 datasets x 16 methods = 512 combinations, which is too
  # slow even with a small n_max (several OpenML datasets - mainly
  # mnist_784/fashion_mnist - have a known slow ARFF parser in
