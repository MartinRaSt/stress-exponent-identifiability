exp1_dr_benchmark:
  n_components: 2
  n_max: 5000
  # explicit override of n_max for specific datasets (specification section
  # 13 recommends a subsample of 5000/10000 for MNIST/Fashion-MNIST - 5000
  # here)
  n_max_overrides:
    mnist_784: 5000
    fashion_mnist: 5000
    # Q1 step 2 (A.4 item 5): a hard cap n_used<=2000 for ALL new hold-out
    # candidates (same value for each, see specification A.3).
    shuttle: 2000
    abalone: 2000
    page_blocks: 2000
    airfoil: 2000
    banknote: 2000
    mfeat_morphological: 2000
    wall_robot: 2000
    hill_valley: 2000
    phoneme: 2000
    dry_bean: 2000
    ccpp: 2000
    swiss_roll_hole: 2000
    gaussian_clusters_separated: 2000
    mobius_strip: 2000
    klein_bottle_4d: 2000
    twin_peaks: 2000
    trefoil_knot: 2000
    # Addendum 2026-09-14 (N>=26)
    hyperbolic_paraboloid: 2000
    anisotropic_ellipsoid: 2000
  # Q1 step 2 (A.5): hold-out datasets - NEVER in `datasets:` (anchor
  # &exp1_datasets, shared with the exp6/fit_alpha_rule fit) - `--datasets
  # all|core|holdout` (exp1_dr_benchmark.py) merges `datasets`+`datasets_holdout`
  # only in the code (`core`=`datasets`, `holdout`=`datasets_holdout`,
  # `all`=both).
  datasets_holdout: *q1_holdout
  # Q1 step 2 (A.8, A.9 item 4): split of 21 methods into Tier1
  # (main_methods + tsne + umap, 15 methods - runs first) and Tier2 (the
  # remaining 6, more expensive/secondary, `--tier tier2` runs only after
  # Tier1). `--tier all` (default) uses all methods from `methods:`
  # unchanged (original behavior, no impact on already existing production
  # data for the 32 core datasets).
  method_tiers:
    tier1:
      - sammon_alpha0_smacof
      - sammon_alpha_auto
      - sammon_alpha_smacof
      - sammon_alpha2_smacof
      - mds
      - pca
      - tsne_auto
